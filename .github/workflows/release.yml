name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Numeric app version (e.g. 2.2.0)
        required: true
        type: string
      signing_policy:
        description: Windows signing policy (release-signing uses release_certificate_2026)
        type: choice
        options: [release-signing, test-signing, unsigned]
        default: release-signing
      publish:
        description: Publish on the public repository after all five packages pass
        type: boolean
        default: false
      allow_test_certificate_release:
        description: Allow publishing with the untrusted SignPath test certificate
        type: boolean
        default: false
      prerelease:
        description: Mark the published release as a pre-release
        type: boolean
        default: false
      changelog:
        description: Release notes (only used when publishing)
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONUTF8: '1'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'

jobs:
  validate:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.inputs.outputs.matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Validate inputs and signing configuration
        id: inputs
        env:
          APP_VERSION: ${{ inputs.version }}
          SIGNING_POLICY: ${{ inputs.signing_policy }}
          PUBLISH: ${{ inputs.publish }}
          ALLOW_TEST_CERTIFICATE_RELEASE: ${{ inputs.allow_test_certificate_release }}
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
        run: |
          python - <<'PY'
          import json, os
          from scripts.release_config import native_build_matrix, validate_release_request
          validate_release_request(
              version=os.environ['APP_VERSION'],
              signing_policy=os.environ['SIGNING_POLICY'],
              publish=os.environ['PUBLISH'] == 'true',
              repository=os.environ['GITHUB_REPOSITORY'],
              has_signpath_token=bool(os.environ['SIGNPATH_API_TOKEN']),
              allow_test_certificate_release=os.environ['ALLOW_TEST_CERTIFICATE_RELEASE'] == 'true',
          )
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('matrix=' + json.dumps(native_build_matrix()) + '\n')
          PY

  test:
    runs-on: windows-2025
    needs: validate
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: python -m pip install -r requirements-test.txt
      - name: Run offline regression suite
        env:
          QT_QPA_PLATFORM: offscreen
          TIKTOK_SIGNER_MODE: api
        run: python scripts/run_tests.py

  build:
    runs-on: ${{ matrix.os }}
    needs: [validate, test]
    timeout-minutes: 90
    env:
      NUITKA_CACHE_DIR: ${{ github.workspace }}/.nuitka-cache
      CLCACHE_DIR: ${{ github.workspace }}/.nuitka-cache/clcache
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.validate.outputs.matrix) }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
          architecture: ${{ matrix.arch == 'x86_64' && 'x64' || 'arm64' }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install Linux build and Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y patchelf ccache zip libegl1 libopengl0 libxkbcommon0 libxcb-cursor0 libnss3 libasound2t64
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt
      - name: Restore compiler cache
        id: compiler-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .nuitka-cache
          key: nuitka-${{ runner.os }}-${{ runner.arch }}-${{ matrix.build_type }}-${{ hashFiles('requirements*.txt') }}-${{ github.sha }}
          restore-keys: |
            nuitka-${{ runner.os }}-${{ runner.arch }}-${{ matrix.build_type }}-${{ hashFiles('requirements*.txt') }}-
      - name: Build and smoke-test the native bundle
        env:
          APP_VERSION: ${{ inputs.version }}
          BUILD_TYPE: ${{ matrix.build_type }}
        run: python scripts/build_release.py --version "$APP_VERSION" --build-type "$BUILD_TYPE"
      # upload-artifact creates the ZIP expected by .signpath/windows-exe.xml.
      # Upload only our EXE: third-party DLLs and FFmpeg are not re-signed.
      - name: Upload unsigned EXE for SignPath
        if: runner.os == 'Windows' && inputs.signing_policy != 'unsigned'
        id: unsigned
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: signpath-input-${{ matrix.build_type }}
          path: build/TiktokStreamKeyGenerator.dist/TiktokStreamKeyGenerator.exe
          if-no-files-found: error
          retention-days: 7
      # In SignPath, release-signing selects release_certificate_2026.
      - name: Sign Windows EXE
        if: runner.os == 'Windows' && inputs.signing_policy != 'unsigned'
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: 6f972417-ec42-48a3-8f85-2ed3dfe07fb7
          project-slug: TikTokStreamKeyGenerator
          signing-policy-slug: ${{ inputs.signing_policy }}
          artifact-configuration-slug: windows-exe
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: build/signed
      - name: Check signature verification rejects modified executables
        timeout-minutes: 3
        if: runner.os == 'Windows' && inputs.signing_policy != 'unsigned'
        shell: pwsh
        env:
          SIGNING_POLICY: ${{ inputs.signing_policy }}
        run: ./scripts/test_windows_signature.ps1 -SignedDirectory build/signed -Policy $env:SIGNING_POLICY
      - name: Verify and install the signed EXE
        timeout-minutes: 2
        if: runner.os == 'Windows' && inputs.signing_policy != 'unsigned'
        shell: pwsh
        env:
          SIGNING_POLICY: ${{ inputs.signing_policy }}
        run: ./scripts/verify_windows_signature.ps1 -SignedDirectory build/signed -Policy $env:SIGNING_POLICY
      - name: Package final application
        env:
          APP_VERSION: ${{ inputs.version }}
          BUILD_TYPE: ${{ matrix.build_type }}
          SIGNING_POLICY: ${{ inputs.signing_policy }}
        run: python scripts/build_release.py --package-only --version "$APP_VERSION" --build-type "$BUILD_TYPE" --signing "$SIGNING_POLICY"
      - name: Upload final download
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: package-${{ matrix.platform }}-${{ matrix.arch }}-${{ matrix.build_type }}
          path: artifacts/*.zip
          if-no-files-found: error
          retention-days: 14
      - name: Upload compilation report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: report-${{ matrix.platform }}-${{ matrix.arch }}-${{ matrix.build_type }}
          path: |
            build/compilation-report.xml
            build/smoke-test.log
          retention-days: 7
      - name: Preserve a failed runtime bundle for diagnosis
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: failed-runtime-${{ matrix.platform }}-${{ matrix.arch }}-${{ matrix.build_type }}
          path: |
            build/TiktokStreamKeyGenerator.dist
            build/TiktokStreamKeyGenerator.app
          if-no-files-found: ignore
          retention-days: 3
      - name: Save compiler cache, including failed smoke checks
        if: always() && steps.compiler-cache.outcome == 'success' && steps.compiler-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .nuitka-cache
          key: ${{ steps.compiler-cache.outputs.cache-primary-key }}

  release:
    if: inputs.publish && github.repository == 'Loukious/TikTokStreamKeyGenerator'
    runs-on: ubuntu-24.04
    needs: [validate, test, build]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: package-*
          path: artifacts
          merge-multiple: true
      - name: Publish completed packages
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          target_commitish: ${{ github.sha }}
          tag_name: v${{ inputs.version }}
          body: |
            ${{ inputs.signing_policy == 'test-signing' && '**Windows signing:** These downloads use a self-signed SignPath test certificate while the production certificate is pending. Windows will not recognize it as a publicly trusted publisher, so security warnings may appear. No certificate installation is required.' || '' }}

            ${{ inputs.changelog }}
          prerelease: ${{ inputs.prerelease }}
          fail_on_unmatched_files: true
          files: artifacts/*.zip
