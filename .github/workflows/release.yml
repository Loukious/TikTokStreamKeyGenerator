name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "The new version number (e.g., 1.1)"
        required: true
      changelog:
        description: "The changelog for this version"
        required: true

env:
  FORCE_COLOR: true

jobs:
  create-tag:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Create Git Tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "v${{ github.event.inputs.version }}" || echo "Tag creation failed (possibly already exists)."
          git push origin "v${{ github.event.inputs.version }}" || echo "Tag push failed (possibly already exists)."

  build_windows:
    runs-on: windows-latest
    needs: create-tag
    strategy:
      matrix:
        build_type: [Release, Debug]

    steps:
      - uses: actions/checkout@v4

      - name: Set Release variable
        run: |
          echo "RELEASE=${{ matrix.build_type }}" >> $env:GITHUB_ENV

      - name: Set up Python 3.13
        uses: actions/setup-python@v3
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if (Test-Path requirements.txt) {
            pip install -r requirements.txt
          }
          "__version__ = '${{ github.event.inputs.version }}'" | Out-File -FilePath _version.py -Encoding utf8

      - name: Build Executable
        run: |
          Write-Host "Release variable is set to: $env:Release"
          if ($env:Release -eq 'Release') {
            nuitka `
            --assume-yes-for-downloads `
            --show-scons `
            --clang `
            --lto=yes `
            --jobs=4 `
            --static-libpython=no `
            --standalone `
            --enable-plugin=anti-bloat `
            --show-modules `
            --show-anti-bloat-changes `
            --follow-stdlib `
            --follow-imports `
            --nofollow-import-to="*.tests" `
            --nofollow-import-to="pydoc" `
            --nofollow-import-to="test" `
            --prefer-source-code `
            --include-module=unittest `
            --windows-console-mode=disable `
            --plugin-enable=pyside6 `
            --windows-company-name="Loukious" `
            --windows-product-name="TikTok Stream Key Generator" `
            --windows-file-version="${{ github.event.inputs.version }}" `
            --windows-product-version="${{ github.event.inputs.version }}" `
            --windows-file-description="TikTok Stream Key Generator" `
            --copyright="Copyright (C) 2026 Loukious" `
            TiktokStreamKeyGenerator.py
          } else {
            nuitka `
            --assume-yes-for-downloads `
            --show-scons `
            --clang `
            --lto=yes `
            --jobs=4 `
            --static-libpython=no `
            --standalone `
            --enable-plugin=anti-bloat `
            --show-modules `
            --show-anti-bloat-changes `
            --follow-stdlib `
            --follow-imports `
            --nofollow-import-to="*.tests" `
            --nofollow-import-to="pydoc" `
            --nofollow-import-to="test" `
            --prefer-source-code `
            --include-module=unittest `
            --plugin-enable=pyside6 `
            TiktokStreamKeyGenerator.py
          }

      - name: Download FFmpeg
        shell: pwsh
        run: |
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-lgpl.zip"
          Invoke-WebRequest -Uri $url -OutFile ffmpeg.zip
          New-Item -ItemType Directory -Force -Path ffmpeg_extract | Out-Null
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_extract -Force
          New-Item -ItemType Directory -Force -Path TiktokStreamKeyGenerator.dist\bin | Out-Null
          $ffmpeg = Get-ChildItem ffmpeg_extract -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          if (-not $ffmpeg) {
            throw "ffmpeg.exe was not found in downloaded archive."
          }
          Copy-Item $ffmpeg.FullName TiktokStreamKeyGenerator.dist\bin\ffmpeg.exe -Force
          TiktokStreamKeyGenerator.dist\bin\ffmpeg.exe -version

      - name: Compress Executable
        run: Compress-Archive -Path TiktokStreamKeyGenerator.dist\* -DestinationPath TiktokStreamKeyGenerator${{ matrix.build_type }}-win-${{ github.event.inputs.version }}.zip -CompressionLevel Optimal

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.build_type }}
          path: |
            TiktokStreamKeyGenerator*.zip

  build_macos:
    runs-on: macos-latest
    needs: create-tag
    strategy:
      matrix:
        architecture: [x86_64, arm64]
        build_type: [Release]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v3
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          echo "__version__ = '${{ github.event.inputs.version }}'" > _version.py

      - name: Build Executable
        run: |
          arch -${{ matrix.architecture }} nuitka \
          --assume-yes-for-downloads \
          --show-scons \
          --clang \
          --lto=yes \
          --jobs=4 \
          --static-libpython=no \
          --standalone \
          --enable-plugin=anti-bloat \
          --enable-plugin=pyside6 \
          --prefer-source-code \
          --macos-target-arch=${{ matrix.architecture }} \
          --macos-create-app-bundle \
          --macos-app-version="${{ github.event.inputs.version }}" \
          --macos-app-name="TikTok Stream Key Generator" \
          TiktokStreamKeyGenerator.py

      - name: Download FFmpeg
        run: |
          if [ "${{ matrix.architecture }}" = "arm64" ]; then
            url="https://ffmpeg.martin-riedl.de/redirect/latest/macos/arm64/snapshot/ffmpeg.zip"
          else
            url="https://ffmpeg.martin-riedl.de/redirect/latest/macos/amd64/snapshot/ffmpeg.zip"
          fi
          curl -L "$url" -o ffmpeg.zip
          mkdir -p ffmpeg_extract
          unzip -q ffmpeg.zip -d ffmpeg_extract
          mkdir -p TiktokStreamKeyGenerator.app/Contents/MacOS/bin
          ffmpeg_path="$(find ffmpeg_extract -type f -name ffmpeg | head -n 1)"
          if [ -z "$ffmpeg_path" ]; then
            echo "ffmpeg was not found in downloaded archive."
            exit 1
          fi
          cp "$ffmpeg_path" TiktokStreamKeyGenerator.app/Contents/MacOS/bin/ffmpeg
          chmod +x TiktokStreamKeyGenerator.app/Contents/MacOS/bin/ffmpeg
          TiktokStreamKeyGenerator.app/Contents/MacOS/bin/ffmpeg -version

      - name: Compress Executable
        run: zip -9 -r TiktokStreamKeyGenerator-${{ matrix.architecture }}-macos-${{ github.event.inputs.version }}.zip TiktokStreamKeyGenerator.app

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.architecture }}
          path: |
            TiktokStreamKeyGenerator*.zip

  build_linux:
    runs-on: ubuntu-22.04
    needs: create-tag
    strategy:
      matrix:
        build_type: [Release]

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache python3-pip zip python3-distutils
          python3 -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip3 install -r requirements.txt; fi
          echo "__version__ = '${{ github.event.inputs.version }}'" > _version.py

      - name: Build Executable
        run: |
          nuitka \
          --assume-yes-for-downloads \
          --show-scons \
          --clang \
          --lto=yes \
          --jobs=4 \
          --static-libpython=no \
          --standalone \
          --enable-plugin=anti-bloat \
          --enable-plugin=pyside6 \
          --show-modules \
          --show-anti-bloat-changes \
          --follow-stdlib \
          --follow-imports \
          --prefer-source-code \
          TiktokStreamKeyGenerator.py

      - name: Download FFmpeg
        run: |
          curl -L "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-lgpl.tar.xz" -o ffmpeg.tar.xz
          mkdir -p ffmpeg_extract TiktokStreamKeyGenerator.dist/bin
          tar -xf ffmpeg.tar.xz -C ffmpeg_extract
          ffmpeg_path="$(find ffmpeg_extract -type f -name ffmpeg | head -n 1)"
          if [ -z "$ffmpeg_path" ]; then
            echo "ffmpeg was not found in downloaded archive."
            exit 1
          fi
          cp "$ffmpeg_path" TiktokStreamKeyGenerator.dist/bin/ffmpeg
          chmod +x TiktokStreamKeyGenerator.dist/bin/ffmpeg
          TiktokStreamKeyGenerator.dist/bin/ffmpeg -version

      - name: Compress Executable
        run: zip -9 -r TiktokStreamKeyGenerator-linux-${{ github.event.inputs.version }}.zip TiktokStreamKeyGenerator.dist/*

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-
          path: |
            TiktokStreamKeyGenerator*.zip

  release:
    runs-on: ubuntu-latest
    needs: [build_linux, build_windows, build_macos]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Create the release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: "v${{ github.event.inputs.version }}"
          body: ${{ github.event.inputs.changelog }}
          files: "artifacts/**/*.zip"
